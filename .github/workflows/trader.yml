name: 자동매매 봇
permissions:
  contents: write
on:
  schedule:
    # ── 코인 (Upbit) ──
    # coin-daemon.service(systemd)가 30초 폴링으로 24/7 처리 → 크론 비활성화
    # - cron: '*/5 * * * *'  # 코인 매수/매도/사이클 (coin-daemon 대체)
    # ── 주식 매매 (KRW 마켓, 평일 장중) ──
    # cycle/monitor는 Oracle VM stock-daemon이 30초 폴링으로 대체 → 크론 비활성화
    - cron: '5 0 * * 1-5'      # 09:05 KST — 주식 매수 (장시작)
    - cron: '30 1 * * 1-5'    # 10:30 KST — 주식 매수 (장중 1차)
    - cron: '30 4 * * 1-5'    # 13:30 KST — 주식 매수 (장중 2차)
    # - cron: '*/30 0-6 * * 1-5' # 09:00~15:30 KST 30분마다 — 주식 모니터링 (daemon 대체)
    - cron: '20 6 * * 1-5'     # 15:20 KST — 마감 청산
    # - cron: '*/10 23 * * 0-4'  # 08:00~08:50 KST — NXT 프리마켓 사이클 (daemon 대체)
    # - cron: '*/10 0-10 * * 1-5' # 09:00~19:50 KST — KRX+NXT 사이클 트레이딩 (daemon 대체)
    # ── 주식 신호·리포트 (GitHub Actions 유지) ──
    - cron: '50 23 * * 0-4'  # 08:50 KST — 신호 생성 (장시작 전)
    - cron: '15 1 * * 1-5'   # 10:15 KST — 신호 생성 (장중 1차)
    - cron: '15 4 * * 1-5'   # 13:15 KST — 신호 생성 (장중 2차)
    - cron: '35 6 * * 1-5'   # 15:35 KST — 일간 리포트
    - cron: '10 0 1-7 * 1'   # 매월 첫 번째 월요일 09:10 KST — 팩터 리밸런싱
    - cron: '0 23 * * 0-4'   # 08:00 KST — 로그 정리
  workflow_dispatch:
    inputs:
      job:
        description: '실행할 job'
        required: true
        default: 'signals'
        type: choice
        options:
          - signals
          - report
          - factor_rebalance
          - cleanup_logs
          - balance
          - test_today
          - buy
          - monitor
          - close
          - profit_sell
          - cycle
          - monitor_036030
          - force_done_submitted
          - coin_buy
          - coin_sell
          - coin_balance
          - sync_positions
      force_done_ticker:
        description: 'force_done_submitted 전용: 완료 처리할 종목명 또는 코드'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KIS_APP_KEY:           ${{ secrets.KIS_APP_KEY }}
  KIS_APP_SECRET:        ${{ secrets.KIS_APP_SECRET }}
  KIS_ACCOUNT_NO:        ${{ secrets.KIS_ACCOUNT_NO }}
  PAPER_TRADE:           ${{ secrets.PAPER_TRADE }}
  STRATEGY:              ${{ secrets.STRATEGY }}
  SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY:          ${{ secrets.SUPABASE_KEY }}
  MAX_ORDER_AMOUNT:      ${{ secrets.MAX_ORDER_AMOUNT }}
  MAX_DAILY_LOSS:        ${{ secrets.MAX_DAILY_LOSS }}
  TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
  MAX_FACTOR_POSITIONS:  ${{ secrets.MAX_FACTOR_POSITIONS }}
  FACTOR_ORDER_AMOUNT:   ${{ secrets.FACTOR_ORDER_AMOUNT }}
  GIST_ID:               ${{ secrets.GIST_ID }}
  GH_TOKEN:              ${{ secrets.GH_TOKEN }}
  UPBIT_ACCESS_KEY:      ${{ secrets.UPBIT_ACCESS_KEY }}
  UPBIT_SECRET_KEY:      ${{ secrets.UPBIT_SECRET_KEY }}

jobs:

  # ════════════════════════════════════════════════
  # GitHub Actions 자동 실행 잡 (스케줄)
  # ════════════════════════════════════════════════

  # ── 08:50 신호 생성 ──────────────────────────
  signals:
    if: >-
      github.event.schedule == '50 23 * * 0-4' ||
      github.event.schedule == '15 1 * * 1-5' ||
      github.event.schedule == '15 4 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'signals')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_signals.py

  # ── 15:35 일간 리포트 ────────────────────────
  report:
    if: github.event.schedule == '35 6 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_report.py

  # ── 매월 첫 번째 월요일 09:10 팩터 리밸런싱 ──
  factor_rebalance:
    if: github.event.schedule == '10 0 1-7 * 1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'factor_rebalance')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_factor_rebalance.py

  # ── 08:00 KST 로그 정리 ─────────────────────
  cleanup_logs:
    if: github.event.schedule == '0 23 * * 0-4' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'cleanup_logs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 로그 정리 실행
        run: python job_cleanup_logs.py
      - name: 정리된 로그 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors profit_buy_cloud.log profit_sell_cloud.log cycle_cloud.log coin_buy_cloud.log coin_sell_cloud.log || true
          git diff --cached --quiet || git commit -m "logs: 3일 경과 로그 정리 [skip ci]"
          git push origin HEAD:main

  # ════════════════════════════════════════════════
  # 수동 실행 전용 (workflow_dispatch)
  # Oracle VM 데몬이 처리하지만 긴급 수동 실행 가능
  # ════════════════════════════════════════════════

  # ── 잔고 즉시 조회 ───────────────────────────
  balance:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'balance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_balance.py

  # ── 오늘 테스트: 신호 생성 → 즉시 매수 ─────
  test_today:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'test_today'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_signals.py
      - run: python job_buy.py

  # ── 매수 (09:05 KST + 수동) ─────────────────
  buy:
    if: >-
      github.event.schedule == '5 0 * * 1-5' ||
      github.event.schedule == '30 1 * * 1-5' ||
      github.event.schedule == '30 4 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'buy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_buy.py

  # ── 모니터링 (수동 전용 — 스케줄 크론은 stock-daemon 대체) ──────────
  monitor:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'monitor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_monitor.py

  # ── 마감 청산 (15:20 KST + 수동) ─────────────
  close:
    if: github.event.schedule == '20 6 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'close')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_close.py

  # ── 수익매도 즉시 실행 (수동) ────────────────
  profit_sell:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'profit_sell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_profit_buy_cloud.py
      - run: python job_profit_sell_cloud.py
      - run: python job_cycle_cloud.py
      - name: 로그 파일 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profit_buy_cloud.log profit_sell_cloud.log
          git diff --cached --quiet && exit 0
          git commit -m "logs: profit/sell 업데이트 $(date +'%Y-%m-%d %H:%M') KST [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done

  # ── 사이클 (수동 전용 — 스케줄 크론은 stock-daemon 대체) ──────────────
  cycle:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'cycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_cycle_cloud.py
      - name: 로그 파일 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add cycle_cloud.log
          git diff --cached --quiet || git commit -m "logs: 사이클 즉시실행 $(date +'%Y-%m-%d %H:%M') KST [skip ci]"
          git push origin HEAD:main

  # ── 케이티알파 모니터링 (수동) ───────────────
  monitor_036030:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'monitor_036030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python monitor_036030.py
      - name: 로그 파일 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add monitor_036030.log
          git diff --cached --quiet || git commit -m "logs: 036030 모니터링 $(date +'%Y-%m-%d %H:%M') KST [skip ci]"
          git push origin HEAD:main

  # ── submitted 잡 강제 완료 (수동) ────────────
  force_done_submitted:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'force_done_submitted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - name: submitted 잡 완료 처리
        run: |
          python3 - <<'PYEOF'
          import os
          os.chdir(os.environ["GITHUB_WORKSPACE"])
          import gist_writer, notify
          from datetime import datetime, timezone, timedelta
          KST = timezone(timedelta(hours=9))

          target = os.environ.get("FORCE_DONE_TICKER", "").strip()
          jobs = gist_writer._read_gist_file("profit_sell_jobs.json") or []
          changed, done_list = False, []

          for job in jobs:
              if job.get("status") != "submitted":
                  continue
              name   = job.get("name", "")
              ticker = job.get("ticker", "")
              if target and target not in (name, ticker):
                  continue
              job["status"]      = "done"
              job["executed_at"] = datetime.now(KST).strftime("%Y-%m-%d %H:%M")
              job["force_done"]  = False
              changed = True
              done_list.append(f"{name}({ticker})")
              print(f"✅ 완료 처리: {name}({ticker})")

          if changed:
              gist_writer._write_gist({"profit_sell_jobs.json": jobs})
              msg = "✅ <b>수동 완료 처리</b>\n" + "\n".join(f"  • {d}" for d in done_list)
              notify.send(msg)
              print("Gist 업데이트 완료")
          else:
              print("처리할 submitted 잡 없음")
          PYEOF
        env:
          FORCE_DONE_TICKER: ${{ github.event.inputs.force_done_ticker }}

  # ── 코인 매수 (5분마다 + 수동) ──────────────
  coin_buy:
    if: >
      github.event.schedule == '*/5 * * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'coin_buy')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_coin_buy.py

  # ── 코인 매도·사이클 (5분마다 + 수동) ────────
  coin_sell:
    if: >
      github.event.schedule == '*/5 * * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'coin_sell')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_coin_sell.py

  # ── Supabase 포지션 동기화 (수동) ──────────
  sync_positions:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'sync_positions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_balance.py

  # ── 코인 잔고 현행화 (5분마다 + 수동) ────────
  coin_balance:
    needs: [coin_buy, coin_sell]
    if: >
      always() &&
      (needs.coin_buy.result == 'success' || needs.coin_sell.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'coin_balance')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: python job_coin_balance.py
