name: 자동매매 봇

on:
  schedule:
    # 모든 시간은 UTC 기준 (KST = UTC+9)
    - cron: '50 23 * * 0-4'    # 08:50 KST — 신호 생성 (일~목 UTC = 월~금 KST)
    - cron: '5 0 * * 1-5'      # 09:05 KST — 매수
    - cron: '*/10 0-6 * * 1-5' # 09:00~15:50 KST 매 10분 — 모니터링 (KRX)
    - cron: '*/5 0-6 * * 1-5'  # 09:00~15:59 KST 매 5분  — 수익매도 (KRX 정규)
    - cron: '20 6 * * 1-5'     # 15:20 KST — 마감 청산
    - cron: '35 6 * * 1-5'     # 15:35 KST — 일간 리포트
    - cron: '10 0 1-7 * 1'     # 매월 첫 번째 월요일 09:10 KST — 팩터 리밸런싱
    # ── NXT (넥스트트레이드) 확장 시간 ──────────────────────────
    - cron: '*/5 23 * * 0-4'   # 08:00~08:59 KST 매 5분 — NXT 장전 (일~목 UTC)
    - cron: '*/5 7-10 * * 1-5' # 16:00~19:59 KST 매 5분 — NXT 장후
  workflow_dispatch:           # 수동 실행 (테스트용)
    inputs:
      job:
        description: '실행할 job (signals/buy/test_today/monitor/close/report/factor_rebalance/profit_sell/cycle)'
        required: true
        default: 'monitor'
        type: choice
        options:
          - test_today
          - signals
          - buy
          - monitor
          - close
          - report
          - factor_rebalance
          - profit_sell
          - cycle
          - monitor_036030

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KIS_APP_KEY:           ${{ secrets.KIS_APP_KEY }}
  KIS_APP_SECRET:        ${{ secrets.KIS_APP_SECRET }}
  KIS_ACCOUNT_NO:        ${{ secrets.KIS_ACCOUNT_NO }}
  PAPER_TRADE:           ${{ secrets.PAPER_TRADE }}
  STRATEGY:              ${{ secrets.STRATEGY }}
  SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY:          ${{ secrets.SUPABASE_KEY }}
  MAX_ORDER_AMOUNT:      ${{ secrets.MAX_ORDER_AMOUNT }}
  MAX_DAILY_LOSS:        ${{ secrets.MAX_DAILY_LOSS }}
  TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
  MAX_FACTOR_POSITIONS:  ${{ secrets.MAX_FACTOR_POSITIONS }}
  FACTOR_ORDER_AMOUNT:   ${{ secrets.FACTOR_ORDER_AMOUNT }}
  GIST_ID:               ${{ secrets.GIST_ID }}
  GH_TOKEN:              ${{ secrets.GH_TOKEN }}

jobs:
  # ── 오늘 테스트: 신호 생성 → 즉시 매수 연속 실행 ──
  test_today:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'test_today'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - name: 신호 생성 (job_signals.py)
        run: python job_signals.py
      - name: 매수 주문 (job_buy.py)
        run: python job_buy.py

  # ── 08:50 신호 생성 ──────────────────────────
  signals:
    if: github.event.schedule == '50 23 * * 0-4' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'signals')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: python job_signals.py

  # ── 09:05 매수 ───────────────────────────────
  buy:
    if: github.event.schedule == '5 0 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'buy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: python job_buy.py

  # ── 매 10분 모니터링 ─────────────────────────
  monitor:
    if: github.event.schedule == '*/10 0-6 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'monitor')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: python job_monitor.py

  # ── 15:20 마감 청산 ──────────────────────────
  close:
    if: github.event.schedule == '20 6 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'close')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: python job_close.py

  # ── 15:35 일간 리포트 ────────────────────────
  report:
    if: github.event.schedule == '35 6 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: python job_report.py

  # ── 매월 첫 번째 월요일 09:10 팩터 리밸런싱 ──
  factor_rebalance:
    if: github.event.schedule == '10 0 1-7 * 1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'factor_rebalance')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: python job_factor_rebalance.py

  # ── 매 5분 수익매도 체크 (KRX 정규 + NXT 장전/장후) ──────────
  profit_sell:
    if: >
      github.event.schedule == '*/5 0-6 * * 1-5' ||
      github.event.schedule == '*/5 23 * * 0-4'  ||
      github.event.schedule == '*/5 7-10 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'profit_sell')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: python job_profit_buy_cloud.py
      - run: python job_profit_sell_cloud.py
      - run: python job_cycle_cloud.py

  # ── 케이티알파(036030) 목표가 모니터링 (KRX 09:00~15:35 매 5분) ──
  monitor_036030:
    if: >
      github.event.schedule == '*/5 0-6 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'monitor_036030')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: python monitor_036030.py
