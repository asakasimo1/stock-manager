name: 매수 추천 자동매수 (09:01/11:00/14:00)
permissions:
  contents: read
on:
  schedule:
    - cron: '1 0 * * 1-5'     # 09:01 KST (평일) — NXT 프리마켓(08:00~08:50) 이후, 정규장 시작 직후
    - cron: '0 2 * * 1-5'     # 11:00 KST (평일)
    - cron: '0 5 * * 1-5'     # 14:00 KST (평일)
  workflow_dispatch:

env:
  GIST_ID:            ${{ secrets.GIST_ID }}
  GH_TOKEN:           ${{ secrets.GH_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
  KRX_ID:             ${{ secrets.KRX_ID }}
  KRX_PW:             ${{ secrets.KRX_PW }}

jobs:
  auto_buy_picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - run: pip install -r requirements.txt
      - run: cp config.example.py config.py
      - run: python auto_buy_picks.py
