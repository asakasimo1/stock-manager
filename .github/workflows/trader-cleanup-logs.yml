name: "[trader] 로그 정리"
permissions:
  contents: write
on:
  schedule:
    - cron: '0 23 * * 0-4'   # 08:00 KST — 로그 정리
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

defaults:
  run:
    working-directory: trader

jobs:
  cleanup_logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 로그 정리 실행
        run: python job_cleanup_logs.py
      - name: 정리된 로그 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors profit_buy_cloud.log profit_sell_cloud.log coin_buy_cloud.log coin_sell_cloud.log || true
          git diff --cached --quiet || git commit -m "logs: 3일 경과 로그 정리 [skip ci]"
          git push origin HEAD:main
